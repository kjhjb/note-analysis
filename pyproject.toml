[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "note-analysis"
version = "0.1.0"
description = "理科试卷笔记分析工具 — 拍照框选识别渲染全流程"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "httpx>=0.26",
    "opencv-python>=4.8",
    "fastapi>=0.108",
    "uvicorn>=0.25",
]

[project.scripts]
note-analysis = "main:cli"

[tool.setuptools.packages.find]
include = ["note_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
